# Project-wide Gradle settings.
# Va en: android/gradle.properties de tu app (lo genera `npx cap add android`).

# JVM args para el daemon de Gradle.
org.gradle.jvmargs=-Xmx2048m

# AndroidX obligatorio para Capacitor 7+ y Media3.
android.useAndroidX=true

# Paralelismo (mejora tiempos de build en proyectos multi-módulo).
org.gradle.parallel=true

# Caching de configuración (opcional, mejora builds incrementales).
org.gradle.caching=true

# Kotlin incremental compilation.
kotlin.incremental=true
